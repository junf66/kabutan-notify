name: Kabutan 好悪材料 Notify

on:
  schedule:
    # 月〜木 20:05 JST = 11:05 UTC（通常営業日の夕方配信）
    - cron: '5 11 * * 1-4'
    # 日 13:35 JST = 04:35 UTC（月曜分の事前配信）
    - cron: '35 4 * * 0'
    # 月〜金 13:35 JST = 04:35 UTC（祝日のみ実行 / script 側で判定）
    - cron: '35 4 * * 1-5'
  workflow_dispatch:
    inputs:
      target_date:
        description: '対象日を YYYY-MM-DD で指定（空欄なら当日）'
        required: false
        default: ''

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run notifier
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          PYTHONIOENCODING: utf-8
          TZ: Asia/Tokyo
          TRIGGER_SCHEDULE: ${{ github.event.schedule || '' }}
          TARGET_DATE: ${{ github.event.inputs.target_date || '' }}
        run: python script.py
