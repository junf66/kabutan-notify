name: Kabutan 好悪材料 Notify

# 2026-05-19: kabutan が AWS WAF (Human Verification) でスクレイピングを
# 明示的に拒否するようになったため、scheduled cron は無効化しています。
# manual (workflow_dispatch) は残してあるので、将来別ソース (TDnet 等) に
# 作り替えるときの足場として利用可。
on:
  # schedule:
  #   - cron: '5 11 * * 1-4'   # 月〜木 20:05 JST
  #   - cron: '35 4 * * 0'     # 日 13:35 JST
  #   - cron: '35 4 * * 1-5'   # 月〜金 13:35 JST (祝日のみ)
  workflow_dispatch:
    inputs:
      target_date:
        description: '対象日を YYYY-MM-DD で指定（空欄なら当日）'
        required: false
        default: ''
      news_id:
        description: 'news_id を直接指定 (例 n202605010243) — 指定時は一覧スキップ'
        required: false
        default: ''

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run notifier
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          PYTHONIOENCODING: utf-8
          TZ: Asia/Tokyo
          TRIGGER_SCHEDULE: ${{ github.event.schedule || '' }}
          TARGET_DATE: ${{ github.event.inputs.target_date || '' }}
          NEWS_ID: ${{ github.event.inputs.news_id || '' }}
        run: python script.py
